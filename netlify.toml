# Netlify configuration for thebusiness.school
# Site is static HTML — no build step needed.

[build]
  publish = "."
  command = ""

# Security & SEO headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML briefly — we want changes to roll out fast
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Correct Content-Type for sitemap + robots
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Force download for business card files
[[headers]]
  for = "/business-card/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"

# Data protection PDFs — cache for a day, schools download these to review
[[headers]]
  for = "/data-protection/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=86400"

# Pretty URLs for blog
[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/resources/"
  status = 301

# Short link for the IT information sheet (sent to pilot teachers)
[[redirects]]
  from = "/it"
  to = "/resources/downloads/TBS-School-IT-Information-Sheet.pdf"
  status = 302

[[redirects]]
  from = "/it-setup"
  to = "/resources/downloads/it-information-sheet.html"
  status = 301

# Revision pack renamed (evergreen). Keep old shared links working.
[[redirects]]
  from = "/resources/a-level-business-revision-pack/TBS_A-Level_Business_Revision_Pack_May2026.pdf"
  to = "/resources/a-level-business-revision-pack/TBS-A-Level-Business-Revision-Pack.pdf"
  status = 301

# Pilot page moved to /waitlist (Autumn 2026 cohort full). Keep old links working.
[[redirects]]
  from = "/pilot"
  to = "/waitlist/"
  status = 301

[[redirects]]
  from = "/pilot/*"
  to = "/waitlist/:splat"
  status = 301

# Working backups must never be served.
# publish = "." means anything inside the repo goes live, so a backup folder left
# in /resources keeps the superseded, uncorrected version of a pack publicly
# downloadable. That is exactly how the withdrawn 9-mark pack stayed reachable
# after its page said the download was off. Keep new backups OUTSIDE this repo;
# these rules cover the ones already here.
# The spec checker and its registry of verified board facts live in the repo so
# they travel with the content they check, but they are internal tooling and
# have no business being served.
[[redirects]]
  from = "/_spec-check/*"
  to = "/resources/"
  status = 404
  force = true

[[redirects]]
  from = "/resources/_varmuuskopio-2026-08-13-numerokorjaus/*"
  to = "/resources/"
  status = 404
  force = true

[[redirects]]
  from = "/resources/gcse-business-which-sentence-earns-which-mark/_varmuuskopio-2026-08-13-korjaus/*"
  to = "/resources/"
  status = 404
  force = true

[[redirects]]
  from = "/resources/a-level-business-the-first-fortnight/_backup-2026-08-13-before-correction/*"
  to = "/resources/"
  status = 404
  force = true

[[headers]]
  for = "/resources/*_varmuuskopio*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/resources/*_backup*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The download counter must reach the server every single time, or it counts nothing
[[headers]]
  for = "/count/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
