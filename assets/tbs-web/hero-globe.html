        var pqx = pq[0] * cosR + pq[2] * sinR;
        var pqz = pq[2] * cosR - pq[0] * sinR;
        var pqy = pq[1] * cosT - pqz * sinT;
        var pqz2 = pq[1] * sinT + pqz * cosT;
        if (pqz2 > -0.02) {
          var gx = cx - pqx * R, gy = cy - pqy * R;
          var gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 10);
          gg.addColorStop(0, "rgba(255,255,255,.95)");
          gg.addColorStop(.35, "rgba(255,215,145,.55)");
          gg.addColorStop(1, "rgba(255,215,145,0)");
          ctx.fillStyle = gg;
          ctx.beginPath(); ctx.arc(gx, gy, 10, 0, 6.2832); ctx.fill();
        }
      }

      for (var c = 0; c < 2; c++) {
        var cv = cities[c];
        var cvx = cv[0] * cosR + cv[2] * sinR;
        var cvz = cv[2] * cosR - cv[0] * sinR;
        var cvy = cv[1] * cosT - cvz * sinT;
        var cvz2 = cv[1] * sinT + cvz * cosT;
        if (cvz2 <= 0.05) continue;
        var vx = cx - cvx * R, vy = cy - cvy * R;
        var vg = ctx.createRadialGradient(vx, vy, 0, vx, vy, 16);
        vg.addColorStop(0, "rgba(255,255,255,.95)");
        vg.addColorStop(.3, "rgba(255,215,145,.65)");
        vg.addColorStop(1, "rgba(255,215,145,0)");
        ctx.fillStyle = vg;
        ctx.beginPath(); ctx.arc(vx, vy, 16, 0, 6.2832); ctx.fill();
        if (!reduced) {
          var ring = ((t * .9 + c * .45) % 1);
          ctx.strokeStyle = "rgba(255,215,145," + (.5 * (1 - ring)).toFixed(3) + ")";
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(vx, vy, 7 + ring * 22, 0, 6.2832); ctx.stroke();
        }
      }

      if (!shown) { fallback.classList.add("hidden"); shown = true; }
    }

    resize();
    window.addEventListener("resize", resize);

    if (reduced) {
      draw(0);
    } else {
      var last = performance.now();
      function loop(now) {
        var dt = (now - last) / 1000;
        last = now;
        if (running) {
          if (!dragging) {
            if (Math.abs(vel) > .02) { rot += vel; vel *= .94; }
            else if (now > idleUntil) {
              /* Vaihteleva nopeus: hidas kun Eurooppa (Lontoo/Suomi) on edessä, nopeampi
                 kun toinen puoli (Amerikat/Tyynimeri) pyörii ohi. Käyttää Lontoon elävää
                 syvyyttä (cities[1]) katsojaa kohti, joten vaihe on aina oikein. */
              var _r = rot * DEG, _cR = Math.cos(_r), _sR = Math.sin(_r);
              var _L = cities[1];
              var _Lz = _L[2] * _cR - _L[0] * _sR;
              var _Ld = _L[1] * Math.sin(tilt) + _Lz * Math.cos(tilt);   // 0.88 = Eurooppa edessä, -0.26 = takana
              var _spd = 1.6 - 1.55 * _Ld;
              if (_spd < 0.4) _spd = 0.4; else if (_spd > 2.1) _spd = 2.1;
              rot += dt * ROT_SPEED * _spd;
            }
          }
          draw(now);
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (en) {
          running = en[0].isIntersecting;
        }, { threshold: 0.02 }).observe(wrap);
      }
      document.addEventListener("visibilitychange", function () {
        running = !document.hidden;
      });
    }
  }
})();
</script>
</body>
</html>
