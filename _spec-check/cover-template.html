<meta charset="utf-8">
<title>Cover template</title>
<!--
  Pack cover template, 640x480.

  These covers used to be one-off images with the text baked into pixels, which
  is why they kept the wrong page count and the wrong specification code long
  after the pack itself was corrected. A text search can never find an error
  inside a JPEG. Now they are generated from covers.json, so a number is fixed
  in one place and the picture follows.

  Regenerate:  python _spec-check/regen-pack-covers.py
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:640px; height:480px; }
  body {
    font-family:'Inter',system-ui,sans-serif;
    background:linear-gradient(150deg,#0a3529 0%,#0e402f 45%,#1b5b40 100%);
    color:#fff; position:relative; overflow:hidden;
  }
  .bar { position:absolute; left:0; right:0; height:9px; background:#d4a72c; }
  .bar.top { top:0; } .bar.bot { bottom:0; }
  .pad { padding:40px 42px 0; }
  .eyebrow {
    font-size:13px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:#d4a72c; margin-bottom:16px;
  }
  h1 { font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:46px;
       line-height:1.02; letter-spacing:-.01em; margin-bottom:16px; }
  h1.long { font-size:40px; }
  .badge { display:inline-block; background:#d4a72c; color:#0a2e22;
           font-size:15px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
           padding:9px 16px; margin-bottom:20px; }
  .meta { font-size:15.5px; font-weight:600; color:#e9f2ec; margin-bottom:16px; }
  ul { list-style:none; }
  li { font-size:14.5px; font-weight:600; color:#f3f8f5; margin-bottom:9px;
       position:relative; padding-left:19px; }
  li::before { content:''; position:absolute; left:0; top:5px;
               width:8px; height:8px; background:#d4a72c; }
  .rule { position:absolute; left:42px; right:42px; bottom:112px;
          height:1px; background:rgba(212,167,44,.55); }
  .kicker { position:absolute; left:42px; right:42px; bottom:64px;
            font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:30px;
            line-height:1.05; }
  .formats { position:absolute; left:42px; bottom:40px;
             font-size:13px; font-weight:700; letter-spacing:.07em;
             text-transform:uppercase; color:#d4a72c; }
  .note { position:absolute; left:42px; right:42px; bottom:20px; font-size:10.5px;
          font-weight:600; color:rgba(233,242,236,.7); line-height:1.3; }
</style>
<div class="bar top"></div>
<div class="pad">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <div class="badge" id="badge"></div>
  <div class="meta" id="meta"></div>
  <ul id="bullets"></ul>
</div>
<div class="rule"></div>
<div class="kicker" id="kicker"></div>
<div class="formats" id="formats"></div>
<div class="note" id="note"></div>
<div class="bar bot"></div>
<script>
  const q = new URLSearchParams(location.search);
  const d = JSON.parse(decodeURIComponent(q.get('d') || '{}'));
  const set = (id, v) => { if (v) document.getElementById(id).textContent = v; };
  set('eyebrow', d.eyebrow); set('title', d.title); set('badge', d.badge);
  set('meta', d.meta); set('kicker', d.kicker); set('formats', d.formats);
  set('note', d.note);
  if ((d.title || '').length > 17) document.getElementById('title').classList.add('long');
  document.getElementById('bullets').innerHTML =
    (d.bullets || []).map(b => '<li>' + b + '</li>').join('');
</script>
