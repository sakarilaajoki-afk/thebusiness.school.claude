<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resource feedback | The Business School</title>
  <meta name="description" content="Give a quick rating and a short note about a Business or Economics teaching resource.">
  <link rel="canonical" href="https://thebusiness.school/resources/feedback/">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#173145;font-family:Arial,Helvetica,sans-serif}
    header{border-bottom:1px solid #e3e9e7}
    header div,main{max-width:700px;margin:auto;padding:20px 24px}
    header div{display:flex;justify-content:space-between;gap:20px;align-items:center}
    a{color:#086b73}
    header a{text-decoration:none;font-size:14px}
    header a:first-child{font-weight:700;color:#173145}
    main{padding-top:42px;padding-bottom:65px}
    h1{font:600 clamp(27px,5vw,35px) Georgia,serif;margin:0 0 8px}
    p{font-size:14px;line-height:1.5;color:#536778}
    form{margin-top:24px}
    .field{margin:0 0 18px}
    .field label,legend{display:block;font-size:14px;font-weight:700;color:#173145;margin-bottom:8px}
    input[type=text]{width:100%;max-width:480px;border:1px solid #cbd6d2;border-radius:7px;padding:10px 12px;font:14px Arial,Helvetica,sans-serif}
    fieldset{border:0;padding:0;margin:0 0 18px}
    .rating{display:flex;gap:12px;flex-wrap:wrap}
    .rating label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:#7a5f08;font-size:14px}
    .rating input{margin:0;accent-color:#0a6b73}
    button{border:0;border-radius:7px;background:#0b3d2e;color:#fff;padding:11px 18px;font:600 14px Arial,Helvetica,sans-serif;cursor:pointer}
    input:focus-visible,button:focus-visible{outline:3px solid #a4d6d5;outline-offset:2px}
    .small{font-size:12px;margin-top:13px}
    .honeypot{position:absolute;left:-9999px}
  </style>
</head>
<body>
  <header><div><a href="/">TBS The Business School</a><a href="/resources/">&larr; Resource Hub</a></div></header>
  <main>
    <h1>What did you think?</h1>
    <p id="intro">A quick rating helps us choose what to improve next. A sentence is optional.</p>
    <form name="resource-feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/resources/feedback/thanks/">
      <input type="hidden" name="form-name" value="resource-feedback">
      <input type="hidden" name="subject" value="Resource Hub feedback">
      <input type="hidden" id="resource-url" name="resource_url" value="">
      <input type="hidden" id="pack" name="pack" value="">
      <input type="hidden" id="origin" name="origin" value="">
      <p class="honeypot"><label>Leave blank <input name="bot-field" type="text" tabindex="-1" autocomplete="off"></label></p>
      <div class="field"><label for="resource">Resource</label><input id="resource" name="resource" type="text" maxlength="160" required placeholder="Which resource?"></div>
      <fieldset id="rating-field"><legend>Rating</legend><div class="rating">
        <label><input type="radio" name="rating" value="1" required aria-label="1 star">★ 1</label>
        <label><input type="radio" name="rating" value="2" aria-label="2 stars">★ 2</label>
        <label><input type="radio" name="rating" value="3" aria-label="3 stars">★ 3</label>
        <label><input type="radio" name="rating" value="4" aria-label="4 stars">★ 4</label>
        <label><input type="radio" name="rating" value="5" aria-label="5 stars">★ 5</label>
      </div></fieldset>
      <div class="field"><label id="feedback-label" for="feedback">Anything to keep or change? (optional)</label><input id="feedback" name="feedback" type="text" maxlength="500"></div>
      <button type="submit">Send</button>
      <p class="small">Private feedback. We do not publish responses from this form. No account or mailing list. <a href="/privacy/">Privacy information</a>.</p>
    </form>
  </main>
  <script>
    (function(){
      var params=new URLSearchParams(location.search);
      var resource=(params.get('resource')||'').trim();
      var path=(params.get('source')||'').trim();
      if(resource)document.getElementById('resource').value=resource.slice(0,160);
      var pack=(params.get('pack')||'').trim();
      if(/^[A-Za-z0-9_-]{1,20}$/.test(pack)){
        document.getElementById('pack').value=pack;
        if(params.get('from')==='purchase'){
          document.getElementById('origin').value='purchase';
          var rf=document.getElementById('rating-field');
          rf.hidden=true;
          rf.querySelectorAll('input').forEach(function(i){i.disabled=true;i.required=false;});
          document.getElementById('intro').textContent='Thank you for buying. One short note helps us improve the packs.';
          document.getElementById('feedback-label').textContent='What worked, what would you change?';
          document.getElementById('feedback').required=true;
        }
        if(!resource)document.getElementById('resource').value='Purchased pack '+pack;
      }
      if(/^\/resources\/[a-z0-9/_-]+\/?$/i.test(path))document.getElementById('resource-url').value=path;
    })();
  </script>
</body>
</html>
